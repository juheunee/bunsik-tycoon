# =====================================================
#  도전! 분식왕 - 공용 기본 설정 (저장소에 올리는 파일)
# =====================================================
# 개인 노트북마다 다른 값(예: 상대 서버 IP)은 이 파일을 고치지 말고
# 같은 폴더에 config.local.properties 를 만들어 적으세요. (Git에서 제외됨)
# 프로그램은 "실행한 폴더"에서 이 파일들을 찾습니다. 저장소 최상위에서 실행하세요.

# 서버가 손님(클라이언트)을 기다릴 포트
server.port=5000

# 클라이언트 시작 화면에 미리 채워 둘 값
client.host=localhost
client.port=5000
client.nickname=
